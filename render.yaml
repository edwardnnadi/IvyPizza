services:
  - type: web
    name: ivy-pizza-api
    runtime: node
    plan: free
    region: frankfurt
    branch: ivy-motion-redesign
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://theivypizza.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
