services:
  - type: web
    name: ivy-pizza-api
    runtime: node
    plan: free
    region: frankfurt
    branch: ivy-motion-redesign
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://theivypizza.com,https://www.theivypizza.com
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_URL
        value: https://api.theivypizza.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AUTH_FRONTEND_URL
        value: https://theivypizza.com
      - key: AUTH_COOKIE_DOMAIN
        value: .theivypizza.com
      - key: AUTH_TRUSTED_ORIGINS
        value: https://theivypizza.com,https://www.theivypizza.com
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "26"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: The Ivy Pizza <orders@theivypizza.com>
      - key: RESEND_API_KEY
        sync: false
